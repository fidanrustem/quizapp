<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard - Manage Quizzes</title>
</head>
<body>
<h2>Quiz Management (Admin)</h2>

<a th:href="@{/templates/addQuiz.html}"><button>+ Add New Question</button></a>

<table border="1" cellpadding="10" style="margin-top: 20px;">
    <thead>
    <tr>
        <th>ID</th>
        <th>Question</th>
        <th>Options</th>
        <th>Correct Answer</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="question : ${questions}">
        <td th:text="${question.id}"></td>
        <td th:text="${question.questionText}"></td>
        <td th:text="${question.options}"></td>
        <td th:text="${question.correctAnswer}"></td>
        <td>
            <!-- Edit Link -->
            <a th:href="@{/editQuiz/{id}(id=${question.id})}">Edit</a> |

            <!-- Delete Form mapping to DELETE method -->
            <form th:action="@{/deleteQuiz/{id}(id=${question.id})}" method="post" style="display:inline;">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" onclick="return confirm('Are you sure you want to delete this question?');">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<br/>
<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>
</body>
</html>
